<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waggy Tails | Daycare Demo</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e9eef6;background:#1b2940;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#1b2940;min-height:100vh}
header{padding:25px 18px;background:#253955;border-bottom:1px solid #ffffff12}header h1{color:#f5efff;font-size:1.55rem;letter-spacing:-.05em;margin:0;font-weight:800}header small{display:block;margin-top:6px;color:#a4b3c7}
main{max-width:1080px;margin:auto;padding:16px}
nav{display:flex;gap:6px;margin-bottom:16px;background:#293e59;padding:5px;border-radius:13px}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 13px;background:#38506c;color:#edf4ff;font-weight:650;min-height:43px}
button:focus-visible,input:focus-visible{outline:2px solid #27e4d0;outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}nav button{flex:1;background:transparent;color:#aabbd0}nav button.active{box-shadow:0 2px 10px #55e4d122;background:#55e4d1;color:#132d37}
.card{background:#293c57;border:1px solid #ffffff10;border-radius:15px;padding:17px;margin:12px 0}
h2{font-size:1.22rem;letter-spacing:-.025em;margin:0 0 12px}h3{margin:12px 0}.muted{color:#a5b3c6;font-size:.9rem;line-height:1.45}
.badge{display:inline-block;border-radius:6px;padding:5px 9px;background:#28584d;color:#b6ffe0;font-size:.8rem;font-weight:750}
.amber{background:#695126;color:#ffd26c}.red{background:#713849;color:#ff879b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.day{border:1px solid #ffffff10;border-radius:12px;padding:12px;background:#304560;text-align:left;color:#d8e5f2;min-height:104px}
.day.selected{border-color:#65e6d8;background:#36566a;box-shadow:inset 0 0 0 1px #21e3ce}
.day strong{display:block;margin-bottom:7px;font-size:.9rem}
.day small{font-size:.8rem;color:#aebfd0}
.track{display:block;height:5px;background:#344457;border-radius:9px;overflow:hidden;margin-top:12px}
.fill{display:block;height:100%;background:#55e4d1;border-radius:9px;transition:width .15s}
.fill.busy{background:#f7b44b}.fill.full{background:#f36b81}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.quick button{background:#364b66;border:1px solid #ffffff12;text-align:left}
.quick button:hover,.quick button:focus-visible{border-color:#22ddca}
.quick button:disabled{opacity:.38}
.quick small{display:block;color:#b3c2d4;font-weight:400;margin-top:4px;font-size:.75rem}
.roster{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #ffffff12;gap:8px}
.iconremove{background:transparent;color:#aebdd0;border:1px solid #ffffff1a;min-height:34px;width:36px;height:34px;padding:0;font-size:1.3rem;line-height:1}
.iconremove:hover{color:#ff8fa0}
label{display:block;margin:12px 0 5px}select,input{width:100%;padding:11px;background:#344a66;color:white;border:1px solid #ffffff24;border-radius:9px}
.notes{display:flex;gap:7px;flex-wrap:wrap}.notes button{background:#3a506b}.notes button:not(:disabled):hover{background:#55e4d1;color:#132d37}
.hidden{display:none}.notice{padding:12px;background:#27534d;border-radius:10px;margin:12px 0;color:#c5fff1}.danger{background:#492635;color:#ffc2cc}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.85fr);gap:14px;align-items:start}
.layout .card{margin-top:0}
footer{text-align:center;color:#8496ae;font-size:.8rem;padding:25px}
@media(max-width:680px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>🐾 Waggy Tails Dog Daycare</h1><small>Lucan, Co. Dublin · SAMPLE DATA · Browser-only alpha</small></header><main><nav><button id="tab-bookings" onclick="show('bookings')">Bookings</button><button id="tab-today" onclick="show('today')">Today</button><button id="tab-pupdate" onclick="show('pupdate')">Pupdate</button></nav><section id="bookings"></section><section id="today" class="hidden"></section><section id="pupdate" class="hidden"></section></main><footer>Demonstration only · Fictional dogs and owners · Changes saved on this browser</footer>
<script>
const KEY='waggy-tails-alpha-v2', CAP=40, DAY=86400000;
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function irishDate(date){const [y,m,d]=date.split('-');return `${d}/${m}/${y}`}
function add(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
const today=iso(new Date());
const samples=[['Bella','Aoife Byrne',30],['Max','Sean Kelly',7],['Luna','Emma Walsh',-2],['Charlie','Niamh Ryan',90],['Daisy','Jack Murphy',13],['Cooper','Sarah OBrien',45],['Milo','Tom Nolan',1],['Ruby','Kate Doyle',120],['Buddy','Lucy Quinn',60],['Rosie','Ben Clarke',-10]];
function fresh(){return {dogs:samples.map((x,i)=>({id:i+1,name:x[0],owner:x[1],expiry:add(today,x[2])})),bookings:samples.map((x,i)=>({dogId:i+1,date:add(today,i<8?0:i===8?1:2),checked:false})),notes:[],nextId:11}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
let view='bookings',start=today,chosen=today,message='';
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(d){let days=Math.round((new Date(d.expiry+'T12:00:00')-new Date(today+'T12:00:00'))/DAY);return days<0?['Expired','red']:days<=14?['Expires in '+days+' day(s)','amber']:['In date','']}
function count(date){return state.bookings.filter(b=>b.date===date).length}
function nearest(date){for(let i=1;i<=365;i++){let a=add(date,-i),b=add(date,i);if(a>=today&&count(a)<CAP)return a;if(count(b)<CAP)return b}return null}
function show(v){view=v;render()}
function render(){['bookings','today','pupdate'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==view);document.getElementById('tab-'+x).classList.toggle('active',x===view)});if(view==='bookings')renderBookings();if(view==='today')renderToday();if(view==='pupdate')renderPupdate()}
function renderBookings(){
 const days=Array.from({length:7},(_,i)=>add(start,i));
 const booked=state.bookings.filter(b=>b.date===chosen);
 const dogs=state.dogs.slice().sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById('bookings').innerHTML=`
 <div class="card"><div class="row"><h2>Week at a glance</h2><div><button aria-label="Previous week" onclick="shift(-7)" ${add(start,-7)<today?'disabled':''}>←</button> <button aria-label="Next week" onclick="shift(7)">→</button></div></div>
 <div class="grid">${days.map(d=>{let used=count(d),pct=used/CAP*100;return `<button class="day ${chosen===d?'selected':''}" aria-pressed="${chosen===d}" onclick="pick('${d}')"><strong>${new Date(d+'T12:00:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'})}</strong><small>${used}/${CAP} booked · ${CAP-used} free</small><span class="track"><span class="fill ${pct>=100?'full':pct>=75?'busy':''}" style="width:${pct}%"></span></span></button>`}).join('')}</div></div>
 <div class="layout"><div class="card"><h2>Quick book · ${irishDate(chosen)}</h2><p class="muted">Tap a dog's name once to book immediately. Dogs already booked or with expired vaccinations are unavailable.</p>
 <div class="quick">${dogs.map(d=>{let already=booked.some(b=>b.dogId===d.id),invalid=d.expiry<chosen,full=booked.length>=CAP;return `<button onclick="quickBook(${d.id})" ${already||invalid?'disabled':''} title="${already?'Already booked':invalid?'Vaccination expired':full?'Day full':'Book '+escapeHTML(d.name)}"><strong>${escapeHTML(d.name)}</strong><small>${already?'✓ Booked':invalid?'Vaccination expired':full?'Full · tap for alternative':'Tap to book'}</small></button>`}).join('')}</div>
 <div class="notice ${message.startsWith('Cannot')?'danger':''}" role="status" aria-live="polite">${escapeHTML(message||'Select a day, then tap a dog to book.')}</div></div>
 <div class="card"><h2>Roster · ${irishDate(chosen)}</h2><p class="muted">${booked.length}/${CAP} booked · ${CAP-booked.length} spaces remaining</p>
 ${booked.map(b=>{let d=state.dogs.find(x=>x.id===b.dogId);return `<div class="roster"><span>${escapeHTML(d.name)} <span class="muted">· ${escapeHTML(d.owner)}</span></span><button class="iconremove" aria-label="Remove ${escapeHTML(d.name)}" title="Remove ${escapeHTML(d.name)}" onclick="cancel(${d.id},'${chosen}')">×</button></div>`}).join('')||'<p class="muted">No bookings for this day yet.</p>'}</div></div>`;
}
function quickBook(id){
 const d=state.dogs.find(x=>x.id===id);
 if(!d)return;
 if(d.expiry<chosen){message='Cannot book: vaccination expired before selected day.'}
 else if(state.bookings.some(b=>b.date===chosen&&b.dogId===id)){message='Cannot book: already booked.'}
 else if(count(chosen)>=CAP){message='Cannot book: day full. Nearest day with room: '+irishDate(nearest(chosen))}
 else{state.bookings.push({dogId:id,date:chosen,checked:false});save();message=d.name+' booked in one tap.'}
 render();
}
function shift(n){start=add(start,n);chosen=start;message='';render()}
function pick(d){chosen=d;message='';render()}
function book(){let id=Number(document.getElementById('dog').value),d=state.dogs.find(x=>x.id===id);if(d.expiry<chosen){message='Cannot book: vaccination expires before the booking date.'}else if(state.bookings.some(b=>b.date===chosen&&b.dogId===id)){message='Cannot book: this dog is already booked for this day.'}else if(count(chosen)>=CAP){let alt=nearest(chosen);message='Cannot book: day full. Nearest day with room: '+(alt?irishDate(alt):'none available')+'.'}else{state.bookings.push({dogId:id,date:chosen,checked:false});save();message=d.name+' booked successfully.'}render()}
function cancel(id,date){state.bookings=state.bookings.filter(b=>!(b.dogId===id&&b.date===date));save();message='Booking removed.';render()}
function renderToday(){let bs=state.bookings.filter(b=>b.date===today);document.getElementById('today').innerHTML=`<div class="card"><h2>Today · ${irishDate(today)}</h2><p>${bs.length}/${CAP} places booked · ${bs.filter(b=>b.checked).length} checked in</p><p class="muted">One tap records each activity immediately.</p></div>${bs.map(b=>{let d=state.dogs.find(x=>x.id===b.dogId),s=status(d),expired=d.expiry<today,ns=state.notes.filter(n=>n.dogId===d.id&&n.date===today);return `<div class="card"><div class="row"><strong>${escapeHTML(d.name)}</strong><span class="badge ${s[1]}">${s[0]}</span></div><p class="muted">Vaccination expiry: ${irishDate(d.expiry)}</p><div class="row"><span>${b.checked?'✓ Checked in':'Not checked in'}</span><button onclick="checkin(${d.id})" ${expired?'disabled':''}>${b.checked?'Undo check-in':'Check in'}</button></div>${expired?'<p class="muted">Expired vaccination: check-in blocked.</p>':''}<div class="notes" style="margin-top:12px">${['Ate','Walked','Played','Napped'].map(x=>`<button onclick="note(${d.id},'${x}')" ${!b.checked?'disabled':''}>${x}</button>`).join('')}</div><p class="muted">${ns.length?ns.map(n=>escapeHTML(n.type)+' '+escapeHTML(n.time)).join(' · '):'No activity notes yet'}</p></div>`}).join('')||'<div class="card">No dogs booked today.</div>'}`}
function checkin(id){let b=state.bookings.find(b=>b.date===today&&b.dogId===id),d=state.dogs.find(d=>d.id===id);if(!b||d.expiry<today)return;b.checked=!b.checked;save();render()}
function note(id,type){let b=state.bookings.find(b=>b.date===today&&b.dogId===id);if(!b||!b.checked)return;state.notes.push({dogId:id,date:today,type,time:new Date().toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'})});save();render()}
function renderPupdate(){
  // Owner-facing demonstration is deliberately fixed to Bella.
  // No owner selector or other dogs' details are rendered here.
  const d=state.dogs.find(d=>d.id===1);
  const ns=state.notes.filter(n=>n.dogId===1&&n.date===today);
  document.getElementById('pupdate').innerHTML=`
    <div class="card">
      <span class="badge">SAMPLE DATA · Owner preview</span>
      <h2 style="margin-top:12px">🐶 Bella's Pupdate</h2>
      <p>Today's updates · ${irishDate(today)}</p>
      <p class="muted">This preview shows only Bella's activity notes.</p>
      ${ns.length
        ? ns.map(n=>`<p class="notice">🐾 ${escapeHTML(n.type)} at ${escapeHTML(n.time)}</p>`).join('')
        : '<p class="notice">No updates for Bella yet today.</p>'}
    </div>
    <p class="muted">Demo only: this is a fixed single-dog preview, not a secure owner login. Authentication and access controls are required before real customer use.</p>`;
}
render();
</script></body></html>
